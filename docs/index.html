s experience across the centuries, a guide to humanity’s achievements and an acute witness to its frailties.\r\n\r\nThe product of a generous and humane sensibility, this timeless account makes intelligible the full span of human history.","cover_url":"https://covers.openlibrary.org/b/id/6757946-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"909"},"readiness":{"level":1,"hours":6.0,"assumed_concepts":["Stone Age","Art History","Atomic Bomb","Wars and Conquests","Timeline"],"style_tags":[],"one_line":"This is a wonderfully accessible introduction to world history, written for young readers but enjoyable for adults – just be prepared for a broad overview rather than deep dives!"},"why":"While *Sapiens* covers a broad scope and some complex economic ideas, *A Little History of the World* provides a foundational timeline and introduces key historical events, which will make understanding the larger narrative and scope of *Sapiens* much more accessible.","confidence":0.8,"availability":[{"branch":"Bishan Public Library","branch_code":"BIPL","call_number":"English 909 GOM","available":2,"total":3,"demo":true},{"branch":"Jurong West Public Library","branch_code":"JWPL","call_number":"English 909 GOM","available":1,"total":1,"demo":true},{"branch":"Tampines Regional Library","branch_code":"TRL","call_number":"English 909 GOM","available":1,"total":1,"demo":true},{"branch":"Central Public Library","branch_code":"CLPL","call_number":"English 909 GOM","available":0,"total":3,"demo":true},{"branch":"Punggol Regional Library","branch_code":"PRL","call_number":"English 909 GOM","available":1,"total":2,"demo":true},{"branch":"Bukit Batok Library","branch_code":"BBPL","call_number":"English 909 GOM","available":0,"total":3,"demo":true},{"branch":"Ang Mo Kio Public Library","branch_code":"AMKPL","call_number":"English 909 GOM","available":1,"total":3,"demo":true}],"demand":{"hot_branches":["Bishan Public Library","Bukit Batok Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"target","order":1,"book":{"id":"9781716994982","title":"Sapiens","author":"Yuval Noah Harari","isbn":"9781716994982","brn":null,"year":2011,"pages":456,"subjects":["Technology and civilization","Human beings","Historical Chronology","Historia universal","Historia","Civilization","Hombre","World history","History","Non-Fiction","Science","SCIENCE / Life Sciences / General","SCIENCE / General","SCIENCE / Life Sciences / Evolution","Weltgeschichte"],"summary":"From a renowned historian comes a groundbreaking narrative of humanity’s creation and evolution—a #1 international bestseller—that explores the ways in which biology and history have defined us and enhanced our understanding of what it means to be “human.”\r\n\r\nOne hundred thousand years ago, at least six different species of humans inhabited Earth. Yet today there is only one—homo sapiens. What happened to the others? And what may happen to us?\r\n\r\nMost books about the history of humanity pursue either a historical or a biological approach, but Dr. Yuval Noah Harari breaks the mold with this highly original book that begins about 70,000 years ago with the appearance of modern cognition. From examining the role evolving humans have played in the global ecosystem to charting the rise of empires, Sapiens integrates history and science to reconsider accepted narratives, connect past developments with contemporary concerns, and examine specific events within the context of larger ideas.\r\n\r\nDr. Harari also compels us to look ahead, because over the last few decades humans have begun to bend laws of natural selection that have governed life for the past four billion years. We are acquiring the ability to design not only the world around us, but also ourselves. Where is this leading us, and what do we want to become?\r\n\r\nFeaturing 27 photographs, 6 maps, and 25 illustrations/diagrams, this provocative and insightful work is sure to spark debate and is essential reading for aficionados of Jared Diamond, James Gleick, Matt Ridley, Robert Wright, and Sharon Moalem.","cover_url":"https://covers.openlibrary.org/b/id/8634250-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"909"},"readiness":{"level":3,"hours":15.0,"assumed_concepts":["human evolution timeline","agricultural revolution","basic economics","world history outline"],"style_tags":[],"one_line":"Readable, but it moves fast across 70,000 years; a light timeline of human history in your head helps."},"why":"Readable, but it moves fast across 70,000 years; a light timeline of human history in your head helps.","confidence":1.0,"availability":[{"branch":"Bishan Public Library","branch_code":"BIPL","call_number":"English 909 HAR","available":1,"total":3,"demo":true},{"branch":"Jurong West Public Library","branch_code":"JWPL","call_number":"English 909 HAR","available":0,"total":3,"demo":true},{"branch":"Tampines Regional Library","branch_code":"TRL","call_number":"English 909 HAR","available":0,"total":2,"demo":true},{"branch":"Woodlands Regional Library","branch_code":"WRL","call_number":"English 909 HAR","available":0,"total":2,"demo":true},{"branch":"Central Public Library","branch_code":"CLPL","call_number":"English 909 HAR","available":1,"total":3,"demo":true},{"branch":"Punggol Regional Library","branch_code":"PRL","call_number":"English 909 HAR","available":0,"total":1,"demo":true},{"branch":"Bukit Batok Library","branch_code":"BBPL","call_number":"English 909 HAR","available":2,"total":2,"demo":true},{"branch":"Ang Mo Kio Public Library","branch_code":"AMKPL","call_number":"English 909 HAR","available":0,"total":2,"demo":true}],"demand":{"hot_branches":["Jurong West Public Library","Tampines Regional Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"after","order":2,"book":{"id":"9783596145393","title":"Guns, Germs, and Steel","author":"Jared Diamond","isbn":"9783596145393","brn":null,"year":1997,"pages":528,"subjects":["prize:pulitzer=1998", "demo":true}],"demand":{"hot_branches":["Tampines Regional Library","Punggol Regional Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"after","order":3,"book":{"id":"9781250818669","title":"The Dawn of Everything","author":"David Graeber, David Wengrow","isbn":"9781250818669","brn":null,"year":2021,"pages":704,"subjects":["Civilization, history","nyt:combined-print-and-e-book-nonfiction=2021-11-28","New York Times bestseller","Civilization","Philosophy","History","HISTORY, ANCIENT","Anthropology","Archaeology","Archaeology / Anthropology","schismogenisis"],"summary":"The renowned activist and public intellectual David Graeber teams up with the professor of comparative archaeology David Wengrow to deliver a trailblazing account of human history, challenging our most fundamental assumptions about social evolution—from the development of agriculture and cities to the emergence of \"the state,\" political violence, and social inequality—and revealing new possibilities for human emancipation\r\n\r\nFor generations, our remote ancestors have been cast as primitive and childlike—either free and equal innocents, or thuggish and warlike. Civilization, we are told, could be achieved only by sacrificing those original freedoms or, alternatively, by taming our baser instincts. David Graeber and David Wengrow show how such theories first emerged in the eighteenth century as a conservative reaction to powerful critiques of European society posed by Indigenous observers and intellectuals. Revisiting this encounter has startling implications for how we make sense of human history today, including the origins of farming, property, cities, democracy, slavery, and civilization itself.\r\n\r\nDrawing on pathbreaking research in archaeology and anthropology, the authors show how history becomes a far more interesting place once we learn to throw off our conceptual shackles and perceive what’s really there. If humans did not spend 95 percent of their evolutionary past in tiny bands of hunter-gatherers, what were they doing all that time? If agriculture, and cities, did not mean a plunge into hierarchy and domination, then what kinds of social and economic organization did they lead to? What was really happening during the periods that we usually describe as the emergence of \"the state\"? The answers are often unexpected, and suggest that the course of human history may be less set in stone, and more full of playful, hopeful possibilities, than we tend to assume.\r\n\r\nThe Dawn of Everything fundamentally transforms our understanding of the human past and offers a path toward imagining new forms of freedom, new ways of organizing society. This is a monumental book of formidable intellectual range, animated by curiosity, moral vision, and a faith in the power of direct action.","cover_url":"https://covers.openlibrary.org/b/id/11359192-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"901"},"readiness":{"level":3,"hours":18.0,"assumed_concepts":["Hunter-gatherer societies","Archaeology","Anthropology","Social inequality","The concept of 'the state'"],"style_tags":[],"one_line":"Get ready to rethink everything you thought you knew about how societies developed – this book is a big, fascinating challenge to conventional history!"},"why":"A demanding counter-argument to Harari's story of early societies.","confidence":0.7,"availability":[{"branch":"Bishan Public Library","branch_code":"BIPL","call_number":"English 901 GRA","available":2,"total":3,"demo":true},{"branch":"Jurong West Public Library","branch_code":"JWPL","call_number":"English 901 GRA","available":1,"total":1,"demo":true},{"branch":"Tampines Regional Library","branch_code":"TRL","call_number":"English 901 GRA","available":0,"total":2,"demo":true},{"branch":"Central Public Library","branch_code":"CLPL","call_number":"English 901 GRA","available":0,"total":1,"demo":true},{"branch":"Punggol Regional Library","branch_code":"PRL","call_number":"English 901 sität","nyt:hardcover-nonfiction=2009-10-11"],"summary":"Britain's greatest science writer comprehensively rebuts the creationists by pulling together the incontrovertible evidence for evolution. Charles Darwin's masterpiece, _On the Origin of Species_, shook society to its core on publication in 1859. Darwin was only too aware of the storm his theory of evolution would provoke but he would surely have raised an incredulous eyebrow at the controversy still raging a century and a half later. Evolution is accepted as scientific fact by all reputable scientists and indeed theologians, yet millions of people continue to question its veracity. In _The Greatest Show on Earth_ Richard Dawkins takes on creationists, including followers of 'Intelligent Design' and all those who question the fact of evolution through natural selection. Like a detective arriving on the scene of a crime, he sifts through fascinating layers of scientific facts and disciplines to build a cast-iron case: from the living examples of natural selection in birds and insects; the 'time clocks' of trees and radioactive dating that calibrate a timescale for evolution; the fossil record and the traces of our earliest ancestors; to confirmation from molecular biology and genetics. All of this, and much more, bears witness to the truth of evolution. The Greatest Show on Earth comes at a critical time: systematic opposition to the fact of evolution is now flourishing as never before, especially in America. In Britain and elsewhere in the world, teachers witness insidious attempts to undermine the status of science in their classrooms. Richard Dawkins provides unequivocal evidence that boldly and comprehensively rebuts such nonsense. At the same time he shares with us his palpable love of the natural world and the essential role that science plays in its interpretation. Written with elegance, wit and passion, it is hard-hitting, absorbing and totally convincing.","cover_url":"https://covers.openlibrary.org/b/id/6257082-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"576.8"},"readiness":{"level":3,"hours":12.0,"assumed_concepts":["Natural Selection","Genetics","Fossil Record","Radioactive Dating","Molecular Biology"],"style_tags":[],"one_line":"Get ready to dive into a compelling scientific argument – a little background in biology will help you appreciate the full scope of Dawkins's case!"},"why":"Reading 'The Greatest Show on Earth' first will give you a good foundation in concepts like natural selection and the fossil record, which are essential building blocks for understanding the more complex ideas about genes and game theory presented in 'The Selfish Gene'.","confidence":0.9,"availability":[{"branch":"Bishan Public Library","branch_code":"BIPL","call_number":"English 576.8 DAW","available":0,"total":1,"demo":true},{"branch":"Jurong West Public Library","branch_code":"JWPL","call_number":"English 576.8 DAW","available":0,"total":3,"demo":true},{"branch":"Woodlands Regional Library","branch_code":"WRL","call_number":"English 576.8 DAW","available":0,"total":2,"demo":true},{"branch":"Central Public Library","branch_code":"CLPL","call_number":"English 576.8 DAW","available":0,"total":2,"demo":true},{"branch":"Punggol Regional Library","branch_code":"PRL","call_number":"English 576.8 DAW","available":0,"total":1,"demo":true},{"branch":"Bukit Batok Library","branch_code":"BBPL","call_number":"English 576.8 DAW","available":0,"total":1,"demo":true}],"demand":{"hot_branches":["Jurong West Public Library","Central Public Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"before","order":1,"book":{"id":"9781440685859","title":"Why evolution is true","author":"Jerry A. Coyne","isbn":"9781440685859","brn":null,"year":2009,"pages":320,"subjects":["Science","Evolution (Biology)","Biological Evolution","Genetic Selection","Nonfiction","Reading Level-Grade 7","Reading Level-Grade 9","Reading Level-Grade 8","Reading Level-Grade 11","Reading Level-Grade 10","Reading Level-Grade 12","Evolution","Biology"],"summary":"Why evolution is more than just a theory: it is a factIn all the current highly publicized debates about creationism and its descendant \"intelligent design,\" there is an element of the controversy that is rarely mentioned—the evidence, the empirical truth of evolution by natural selection. Even Richard Dawkins and Stephen Jay Gould, while extolling the beauty of evolution and examining case studies, have not focused on the evidence itself. Yet the proof is vast, varied, and magnificent, drawn from many different fields of science. Scientists are observing species splitting into two and are finding more and more fossils capturing change in the past—dinosaurs that have sprouted feathers, fish that have grown limbs.Why Evolution Is True weaves together the many threads of modern work in genetics, paleontology, geology, molecular biology, and anatomy that demonstrate the \"indelible stamp\" of the processes first proposed by Darwin. In crisp, lucid prose accessible to a wide audience, Why Evolution Is True dispels common misunderstandings and fears about evolution and clearly confirms that this amazing process of change has been firmly established as a scientific truth.","cover_url":"https://covers.openlibrary.org/b/id/5549166-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"576.8"},"readiness":{"level":3,"hours":8.0,"assumed_concepts":["Natural Selection","Genetics","Fossil Record","Comparative Anatomy","Molecular Biology"],"style_tags":[],"one_line":"Get ready to dive into a fascinating exploration of how we know evolution is real – a little science background will help you appreciate the full picture!"},"why":"Reading 'Why Evolution is True' first will give you a solid foundation in genetics and natural selection, which are essential concepts for understanding Dawkins' more complex exploration of genes and their role in evolution.","confidence":0.8,"availability":[{"branch": ing","Psychological aspects"],"summary":"A smart and funny book by a prominent Harvard psychologist, which uses groundbreaking research and (often hilarious) anecdotes to show us why we're so lousy at predicting what will make us happy -- and what we can do about it.Most of us spend our lives steering ourselves toward the best of all possible futures, only to find that tomorrow rarely turns out as we had expected. Why? As Harvard psychologist Daniel Gilbert explains, when people try to imagine what the future will hold, they make some basic and consistent mistakes. Just as memory plays tricks on us when we try to look backward in time, so does imagination play tricks when we try to look forward. Using cutting-edge research, much of it original, Gilbert shakes, cajoles, persuades, tricks and jokes us into accepting the fact that happiness is not really what or where we thought it was. Among the unexpected questions he poses: Why are conjoined twins no less happy than the general population? When you go out to eat, is it better to order your favourite dish every time, or to try something new? If Ingrid Bergman hadn't gotten on the plane at the end of Casablanca, would she and Bogey have been better off?Smart, witty, accessible and laugh-out-loud funny, Stumbling on Happiness brilliantly describes all that science has to tell us about the uniquely human ability to envision the future, and how likely we are to enjoy it when we get there.From the Hardcover edition.","cover_url":"https://covers.openlibrary.org/b/id/6803663-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"158"},"readiness":{"level":2,"hours":8.0,"assumed_concepts":["Cognitive biases","Experimental psychology","Correlation vs. Causation","Hedonic adaptation","Subjective well-being"],"style_tags":[],"one_line":"Get ready to question your assumptions about what makes you happy – this book uses psychology to show you how often we get it wrong!"},"why":"While both books explore cognitive bias l":3,"demo":true}],"demand":{"hot_branches":["Bishan Public Library","Tampines Regional Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"target","order":3,"book":{"id":"9781804220375","title":"Thinking, fast and slow","author":"Daniel Kahneman","isbn":"9781804220375","brn":null,"year":2011,"pages":548,"subjects":["Intuition","Thought and thinking","Reasoning","Decision making","New York Times bestseller","Long Now Manual for Civilization","Thinking","Kognition","77.32 intelligence, creativity","New York Times reviewed","Reason","Cognition","Self-actualization (Psychology)","Cognitive psychology","Psychology"],"summary":"In his mega bestseller, Thinking, Fast and Slow, Daniel Kahneman, world-famous psychologist and winner of the Nobel Prize in Economics, takes us on a groundbreaking tour of the mind and explains the two systems that drive the way we think.\r\n\r\nSystem 1 is fast, intuitive, and emotional; System 2 is slower, more deliberative, and more logical. The impact of overconfidence on corporate strategies, the difficulties of predicting what will make us happy in the future, the profound effect of cognitive biases on everything from playing the stock market to planning our next vacation―each of these can be understood only by knowing how the two systems shape our judgments and decisions.\r\n\r\nEngaging the reader in a lively conversation about how we think, Kahneman reveals where we can and cannot trust our intuitions and how we can tap into the benefits of slow thinking. He offers practical and enlightening insights into how choices are made in both our business and our personal lives―and how we can use different techniques to guard against the mental glitches that often get us into trouble. Topping bestseller lists for almost ten years, Thinking, Fast and Slow is a contemporary classic, an essential book that has changed the lives of millions of readers.","cover_url":"https://covers.openlibrary.org/b/id/13290711-M.jpg","reservations":0 hor of You Are About to Make a Terrible Mistake! comes Noise, a revolutionary exploration of why people make bad judgments, and how to control both noise and cognitive bias.\r\n\r\nImagine that two doctors in the same city give different diagnoses to identical patients - or that two judges in the same courthouse give markedly different sentences to people who have committed the same crime. Suppose that different interviewers at the same firm make different decisions about indistinguishable job applicants - or that when a company is handling customer complaints, the resolution depends on who happens to answer the phone. Now imagine that the same doctor, the same judge, the same interviewer, or the same customer service agent makes different decisions depending on whether it is morning or afternoon, or Monday rather than Wednesday. These are examples of noise: variability in judgments that should be identical.\r\n\r\nIn Noise, Daniel Kahneman, Olivier Sibony, and Cass R. Sunstein show the detrimental effects of noise in many fields, including medicine, law, economic forecasting, forensic science, bail, child protection, strategy, performance reviews, and personnel selection. Wherever there is judgment, there is noise. Yet, most of the time, individuals and organizations alike are unaware of it. They neglect noise. With a few simple remedies, people can reduce both noise and bias, and so make far better decisions.\r\n\r\nPacked with original ideas, and offering the same kinds of research-based insights that made Thinking, Fast and Slow and Nudge groundbreaking New York Times best sellers, Noise explains how and why humans are so susceptible to noise in judgment - and what we can do about it.","cover_url":"https://covers.openlibrary.org/b/id/10981966-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"153.83"},"readiness":{"level":3,"hours":12.0,"assumed_concepts":["cognitive bias","statistical variability","expert judgment","systemic error","decision-making frameworks"],"style_tags":[],"one_line":"Get ready to think critically about how even experts can be inconsistent, and how we can all make better judgments!"},"why":"Kahneman's follow-up on the other source of bad judgment: inconsistency.","confidence":0.9,"availability":[{"branch":"Bishan Public Library","branch_code":"BIPL","call_number":"English 153.83 KAH","available":1,"total":3,"demo":true},{"branch":"Jurong West Public Library","branch_code":"JWPL","call_number":"English 153.83 KAH","available":1,"total":2,"demo":true},{"branch":"Tampines Regional Library","branch_code":"TRL","call_number":"English 153.83 KAH","available":1,"total":2,"demo":true},{"branch":"Woodlands Regional Library","branch_code":"WRL","call_number":"English 153.83 KAH","available":3,"total":3,"demo":true},{"branch":"Central Public Library","branch_code":"CLPL","call_number":"English 153.83 KAH","available":1,"total":3,"demo":true},{"branch":"Punggol Regional Library","branch_code":"PRL","call_number":"English 153.83 KAH","available":1,"total":1,"demo":true},{"branch":"Ang Mo Kio Public Library","branch_code":"AMKPL","call_number":"English 153.83 KAH","available":1,"total":1,"demo":true}],"demand":{"hot_branches":["Bishan Public Library","Jurong West Public Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"after","order":5,"book":{"id":"9781912282562","title":"Judgment under Uncertainty","author":"Daniel Kahneman, Paul Slovic","isbn":"9781912282562","brn":null,"year":2017,"pages":555,"subjects":["Intuition","Thought and thinking","Reasoning","Decision making","New York Times bestseller","Long Now Manual for Civilization","Thinking","Kognition","77.32 intelligence, creativity","New York Times reviewed","Reason","Cognition","Self-actualization (Psychology)","Cognitive psychology","Psychology"],"summary":"","cover_url":null,"reservations":0,"audience":[],"source":"openlibrary"},"readiness":{"level":3,"hours":18.0,"assumed_concepts":["Cognitive biases","Heuristics","Prob  in a landmark 2005 study, even experts’ predictions are only slightly better than chance. However, an important and underreported conclusion of that study was that some experts do have real foresight, and Tetlock has spent the past decade trying to figure out why. What makes some people so good? And can this talent be taught?\r\n \r\nIn Superforecasting, Tetlock and coauthor Dan Gardner offer a masterwork on prediction, drawing on decades of research and the results of a massive, government-funded forecasting tournament. The Good Judgment Project involves tens of thousands of ordinary people—including a Brooklyn filmmaker, a retired pipe installer, and a former ballroom dancer—who set out to forecast global events. Some of the volunteers have turned out to be astonishingly good. They’ve beaten other benchmarks, competitors, and prediction markets. They’ve even beaten the collective judgment of intelligence analysts with access to classified information. They are \"superforecasters.\"\r\n \r\nIn this groundbreaking and accessible book, Tetlock and Gardner show us how we can learn from this elite group. Weaving together stories of forecasting successes (the raid on Osama bin Laden’s compound) and failures (the Bay of Pigs) and interviews with a range of high-level decision makers, from David Petraeus to Robert Rubin, they show that good forecasting doesn’t require powerful computers or arcane methods. It involves gathering evidence from a variety of sources, thinking probabilistically, working in teams, keeping score, and being willing to admit error and change course. Superforecasting offers the first demonstrably effective way to improve our ability to predict the future—whether in business, finance, politics, international affairs, or daily life—and is destined to become a modern classic.","cover_url":"https://covers.openlibrary.org/b/id/9142114-M.jpg","reservations":0,"audience":[],"source":"openlibrary"},"readiness":{"level":3,"hours":8.0,"assumed_concepts":["co anch":"Ang Mo Kio Public Library","branch_code":"AMKPL","call_number":"English 158.1 FOG","available":0,"total":2,"demo":true}],"demand":{"hot_branches":["Bishan Public Library","Tampines Regional Library"],"hidden_gem":false,"reservations":0,"demo":true}},{"role":"after","order":2,"book":{"id":"9782081342620","title":"The Power of Habit","author":"Charles Duhigg","isbn":"9782081342620","brn":null,"year":2012,"pages":404,"ddc":"158.1","subjects":["Social aspects","Habit","Change (Psychology)","New York Times bestseller","nyt:combined_print_nonfiction=2012-03-03","Popular Works","Habits","Psychological Adaptation","Behavior","Habit breaking","Mental Processes","Organizational Innovation","Life Change Events","Psychology","Aspect social"],"summary":"A young woman walks into a laboratory. Over the past two years, she has transformed almost every aspect of her life. She has quit smoking, run a marathon, and been promoted at work. The patterns inside her brain, neurologists discover, have fundamentally changed. Marketers at Procter & Gamble study videos of people making their beds. They are desperately trying to figure out how to sell a new product called Febreze, on track to be one of the biggest flops in company history. Suddenly, one of them detects a nearly imperceptible pattern -- and with a slight shift in advertising, Febreze goes on to earn a billion dollars a year. An untested CEO takes over one of the largest companies in America. His first order of business is attacking a single pattern among his employees -- how they approach worker safety -- and soon the firm, Alcoa, becomes the top performer in the Dow Jones. What do all these people have in common? They achieved success by focusing on the patterns that shape every aspect of our lives. They succeeded by transforming habits. In The Power of Habit, award-winning New York Times business reporter Charles Duhigg takes us to the thrilling edge of scientific discoveries that explain why habits exist and how they can be changed. With penetrating intelligence and an ability to distill vast amounts of information into engrossing narratives, Duhigg brings to life a whole new understanding of human nature and its potential for transformation. Along the way we learn why some people and companies struggle to change, despite years of trying, while others seem to remake themselves overnight. We visit laboratories where neuroscientists explore how habits work and where, exactly, they reside in our brains. We discover how the right habits were crucial to the success of Olympic swimmer Michael Phelps, Starbucks CEO Howard Schultz, and civil-rights hero Martin Luther King, Jr. We go inside Procter & Gamble, Target superstores, Rick Warrens Saddleback Church, NFL locker rooms, and the nations largest hospitals and see how implementing so-called keystone habits can earn billions and mean the difference between failure and success, life and death. At its core, The Power of Habit contains an exhilarating argument: The key to exercising regularly, losing weight, raising exceptional children, becoming more productive, building revolutionary companies and social movements, and achieving success is understanding how habits work. Habits arent destiny. As Charles Duhigg shows, by harnessing this new science, we can transform our businesses, our communities, and our lives. - Publisher.","cover_url":"https://covers.openlibrary.org/b/id/9078085-M.jpg","reservations":0,"audience":[],"source":"openlibrary"},"readiness":{"level":2,"hours":8.0,"assumed_concepts":["Neurology","Marketing principles","Business strategy","Psychological research","Behavioral psychology"],"style_tags":[],"one_line":"Get ready to explore how small routines shape our lives and learn practical strategies for positive change!"},"why":"The science behind the habit loop Clear builds on.","confidence":0.8,"availability":[{"branch":"Bishan Public Library","branch_code":"BIPL","call_number":"English 158.1 DUH","available":2,"total":2," ychology"],"summary":"In his mega bestseller, Thinking, Fast and Slow, Daniel Kahneman, world-famous psychologist and winner of the Nobel Prize in Economics, takes us on a groundbreaking tour of the mind and explains the two systems that drive the way we think.\r\n\r\nSystem 1 is fast, intuitive, and emotional; System 2 is slower, more deliberative, and more logical. The impact of overconfidence on corporate strategies, the difficulties of predicting what will make us happy in the future, the profound effect of cognitive biases on everything from playing the stock market to planning our next vacation―each of these can be understood only by knowing how the two systems shape our judgments and decisions.\r\n\r\nEngaging the reader in a lively conversation about how we think, Kahneman reveals where we can and cannot trust our intuitions and how we can tap into the benefits of slow thinking. He offers practical and enlightening insights into how choices are made in both our business and our personal lives―and how we can use different techniques to guard against the mental glitches that often get us into trouble. Topping bestseller lists for almost ten years, Thinking, Fast and Slow is a contemporary classic, an essential book that has changed the lives of millions of readers.","cover_url":"https://covers.openlibrary.org/b/id/13290711-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"153.4"},"readiness":{"level":3,"hours":15.0,"assumed_concepts":["Cognitive biases","Behavioral economics","Psychology","Statistical reasoning","Heuristics"],"style_tags":[],"one_line":"Get ready to explore how your brain *really* works – it's fascinating, and a little surprising!"},"why":"Understanding Kahneman's exploration of cognitive biases and heuristics in 'Thinking, Fast and Slow' will give you a strong foundation for grappling with Taleb's discussion of randomness and predictability in 'The Black Swan,' as both books challenge how we perceive and interpret the world. he reason for failure. If our appreciation of uncertainty improves, our predictions can get better too. This is the “prediction paradox”: The more humility we have about our ability to make predictions, the more successful we can be in planning for the future.\r\n\r\nIn keeping with his own aim to seek truth from data, Silver visits the most successful forecasters in a range of areas, from hurricanes to baseball, from the poker table to the stock market, from Capitol Hill to the NBA. He explains and evaluates how these forecasters think and what bonds they share. What lies behind their success? Are they good—or just lucky? What patterns have they unraveled? And are their forecasts really right? He explores unanticipated commonalities and exposes unexpected juxtapositions. And sometimes, it is not so much how good a prediction is in an absolute sense that matters but how good it is relative to the competition. In other cases, prediction is still a very rudimentary—and dangerous—science.\r\n\r\nSilver observes that the most accurate forecasters tend to have a superior command of probability, and they tend to be both humble and hardworking. They distinguish the predictable from the unpredictable, and they notice a thousand little details that lead them closer to the truth. Because of their appreciation of probability, they can distinguish the signal from the noise.\r\n\r\nWith everything from the health of the global economy to our ability to fight terrorism dependent on the quality of our predictions, Nate Silver’s insights are an essential read.","cover_url":"https://covers.openlibrary.org/b/id/7256893-M.jpg","reservations":0,"audience":[],"source":"openlibrary","ddc":"303.49"},"readiness":{"level":3,"hours":12.0,"assumed_concepts":["Probability","Statistics","Data Analysis","Regression to the Mean","Confirmation Bias"],"style_tags":[],"one_line":"Get ready to think critically about how we make predictions – it's a fascinating look at how uncertainty shapes our world
